<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ea33">
  <title>プリセット答え合わせ | 34番出口</title>
  <script src="./data.js"></script>
  <style>
    :root {
      --yellow: #f4ea33;
      --black: #050505;
      --white: #ffffff;
      --paper: #e8e8df;
      --line: rgba(244, 234, 51, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      background: #0d0d0d;
    }

    header img {
      display: block;
      width: min(150px, 42vw);
    }

    header a {
      color: var(--yellow);
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 28px 16px 42px;
    }

    .label {
      margin: 0 0 12px;
      color: var(--yellow);
      font-size: 13px;
      font-weight: 1000;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--yellow);
      font-size: clamp(36px, 12vw, 64px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--paper);
      font-size: 16px;
      line-height: 1.65;
      font-weight: 780;
    }

    form {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 4px solid var(--yellow);
      background: #101010;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--paper);
      font-size: 13px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 52px;
      border: 3px solid var(--yellow);
      border-radius: 0;
      background: var(--black);
      color: var(--white);
      padding: 10px 12px;
      font: inherit;
      font-size: 21px;
      font-weight: 900;
    }

    button {
      min-height: 54px;
      border: 0;
      background: var(--yellow);
      color: var(--black);
      font: inherit;
      font-size: 17px;
      font-weight: 1000;
    }

    .message {
      min-height: 24px;
      margin: 14px 0 0;
      color: var(--yellow);
      font-weight: 900;
    }

    .result {
      margin-top: 22px;
    }

    .result h2 {
      margin: 0 0 14px;
      font-size: clamp(28px, 9vw, 44px);
      line-height: 1;
    }

    .answer-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .answer-list li {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      border: 2px solid var(--line);
      background: #111;
      padding: 12px;
    }

    .answer-list span {
      color: var(--yellow);
      font-size: 13px;
      font-weight: 1000;
    }

    .answer-list strong {
      color: var(--white);
      font-size: clamp(20px, 6vw, 30px);
      line-height: 1.08;
    }

    .none {
      color: #aeb5c0;
    }

    .hint {
      margin-top: 20px;
      color: #aeb5c0;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <header>
    <img src="../assets/logo.jpg" alt="34番出口 Exit34">
    <a href="../index.html#anomalies">ホームへ戻る</a>
  </header>

  <main>
    <p class="label">PRESET ANSWER CHECK</p>
    <h1>プリセット答え合わせ</h1>
    <p class="lead">プリセット番号と4けたのパスワードを入力すると、そのプリセットで出る異変を確認できます。</p>

    <form data-check-form>
      <label>
        プリセット番号
        <input data-preset-number type="number" min="1" max="2880" inputmode="numeric" autocomplete="off" required>
      </label>
      <label>
        パスワード
        <input data-password type="password" pattern="[0-9]{4}" maxlength="4" inputmode="numeric" autocomplete="off" required>
      </label>
      <button type="submit">答え合わせを見る</button>
    </form>
    <p class="message" data-message></p>

    <section class="result" data-result hidden></section>
    <p class="hint">1回目の30番出口は、どのプリセットでも必ず異変なしです。</p>
  </main>

  <script>
    const form = document.querySelector("[data-check-form]");
    const message = document.querySelector("[data-message]");
    const result = document.querySelector("[data-result]");
    const presets = new Map((window.PRESET_ANSWERS || []).map((preset) => [Number(preset.number), preset]));

    function expectedPassword(number) {
      return String(1000 + ((number * 73 + 417) % 9000)).padStart(4, "0");
    }

    async function sha256(text) {
      const bytes = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(hash)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      })[char]);
    }

    function answerRow(label, value) {
      const text = value || "異変なし";
      const className = value ? "" : " class=\"none\"";
      return `<li><span>${label}</span><strong${className}>${escapeHtml(text)}</strong></li>`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.hidden = true;
      result.innerHTML = "";
      message.textContent = "";

      const number = Number(document.querySelector("[data-preset-number]").value);
      const password = document.querySelector("[data-password]").value.trim();
      const preset = presets.get(number);
      if (!preset) {
        message.textContent = "プリセット番号を確認してください。";
        return;
      }
      if (!/^[0-9]{4}$/.test(password)) {
        message.textContent = "パスワードは4けたの数字で入力してください。";
        return;
      }
      let isPasswordOk = password === expectedPassword(number);
      if (!isPasswordOk && window.crypto?.subtle) {
        const hash = await sha256(password);
        isPasswordOk = hash === preset.passwordHash;
      }
      if (!isPasswordOk) {
        message.textContent = "パスワードが違います。";
        return;
      }

      const rows = [
        answerRow("1回目", ""),
        ...preset.anomalies.slice(0, 5).map((value, index) => answerRow(`${index + 2}回目`, value)),
      ].join("");
      result.innerHTML = `
        <h2>プリセット${number}</h2>
        <ul class="answer-list">${rows}</ul>
      `;
      result.hidden = false;
      message.textContent = "表示しました。";
    });
  </script>
</body>
</html>
